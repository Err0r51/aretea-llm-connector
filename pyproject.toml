[project]
name = "aretea-drive-mcp"
version = "0.1.0"
description = "Read-only Google Drive MCP connector for Aretea (Claude web). Service-account data hop, identity-only client hop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- MCP server + client-hop auth ---
    # FastMCP 3.x: GoogleProvider, OAuthProxy, native JWT minting, AsyncKeyValue storage, middleware.
    # Pin >=3.4.2 — 2.x has unpatched CVEs; 3.4.1 floors starlette>=1.0.1 (CVE-2026-48710).
    "fastmcp>=3.4.2",
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.14",
    # AsyncKeyValue storage backend for FastMCP client_storage (FileTreeStore on the Railway volume).
    "py-key-value-aio>=0.4.4,<0.5",
    # Fernet at-rest encryption for the token store (imported directly in auth/store.py).
    "cryptography>=44",
    # --- Drive hop (service account, read-only) ---
    "google-api-python-client>=2.198,<3",
    "google-auth>=2.55,<3",
    "google-auth-httplib2>=0.4,<1",
    # sync->async bridge for the blocking Google client (also a transitive FastMCP dep; pinned as we import it).
    "anyio>=4,<5",
    # --- observability ---
    "structlog>=25.1",
    # --- ASGI server ---
    "uvicorn[standard]>=0.35",
    # --- binary text extraction (PRD 5: text-layer PDF + modern OOXML Office) ---
    # In-process, read-only parse of get_media bytes (no Google-side conversion). pypdf is BSD +
    # pure-Python (deliberately NOT PyMuPDF/fitz — AGPL). python-docx (imports `docx`) and
    # python-pptx (imports `pptx`) pull lxml; python-pptx also pulls Pillow. openpyxl is pure-Python.
    # All four ship cp312 manylinux wheels, so no build toolchain — ⚠ verify wheel resolution on the
    # Railway Metal builder at build (python3.12-slim-trixie, no apt, no RUN --mount).
    "pypdf>=6.13.3,<7",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "mypy>=1.14",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    # respx mocks httpx (FastMCP<->Google OIDC hop). The google-api-python-client uses httplib2 —
    # mock that with the library's built-in googleapiclient.http.HttpMock (no dependency).
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aretea_drive_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["aretea_drive_mcp", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
# S101 (assert): our security invariants (no-DWD, driveId wall) are expressed as asserts by design;
# they are also compiled out under `python -O`, so the runtime checks in code raise explicitly instead.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# google-api-python-client / httplib2 ship partial or no stubs; the extraction libs (docx/pptx) ship
# none either. openpyxl/pypdf ship py.typed on recent versions, but list them here harmlessly so a
# pinned-version downgrade can't break the strict build.
[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google_auth_httplib2.*",
    "httplib2.*",
    "key_value.*",
    "pypdf.*",
    "docx.*",
    "pptx.*",
    "openpyxl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.semantic_release]
# Cut the `vX.Y.Z` tag + GitHub Release ONLY — never a write-back commit to source.
# `version_toml` / `version_variables` are intentionally omitted (both default to `[]`), so PSR
# stamps NOTHING: the current version is read from the latest matching git tag, the next is derived
# from Conventional Commits since it. The no-write-back rule is LOAD-BEARING — a bump commit pushed
# to `main` would (a) fire a second Railway autodeploy (double deploy, AC9) and (b) be rejected
# outright once branch protection lands. `project.version` above is a floor for /health only; PSR
# never bumps it. The GitHub Action enforces this at run time with `commit: false`.
tag_format = "v{version}"
allow_zero_version = true  # stay on 0.x while pre-1.0
major_on_zero = false      # a breaking change on 0.x bumps the minor, not straight to 1.0.0
build_command = ""         # a deployed service, not a published package — nothing to build

[tool.semantic_release.branches.main]
match = "main"  # release only from main (the push:[main] release job)
